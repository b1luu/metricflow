name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting and static analysis are cheap and unambiguous, so they run
  # first and on their own: a gofmt failure shouldn't be buried under a
  # test log.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./... -count=1

      # The reason this workflow exists. The race detector needs a 64-bit C
      # toolchain, which the development machine (Windows) doesn't have - so
      # until now DESIGN §20 could only say the concurrency tests catch lost
      # updates and Go's own concurrent-map panic, not the subtler races a
      # detector would find. Linux runners have it, so the claim gets
      # checked here instead of being permanently caveated.
      - name: go test -race
        run: go test ./... -race -count=1

      # Benchmarks aren't a performance gate - runner hardware is far too
      # noisy for that, and a threshold would just flap. This only proves
      # they still compile and run, so a refactor can't quietly break the
      # measurement code that DESIGN §5's numbers depend on.
      - name: benchmarks compile and run
        run: go test ./... -run='^$' -bench=. -benchtime=10x

      # §30: the hand-written parser is only defensible while it agrees with
      # encoding/json, and the seed corpus that runs with the ordinary tests
      # only covers the cases somebody thought of. A short fuzz run on every
      # push looks for the ones nobody did - it found the invalid-UTF-8
      # divergence in under a second. A failure writes the offending input
      # into testdata, so it becomes a permanent regression test rather than
      # a one-off red build; the upload keeps it when the runner is thrown
      # away.
      - name: the parser must keep agreeing with encoding/json
        run: go test -run='^$' -fuzz=FuzzParseEventAgreesWithEncodingJSON -fuzztime=45s .

      - name: keep whatever the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: testdata/fuzz/
          if-no-files-found: ignore

  # The end-to-end claim from DESIGN §21: over a real socket, the server
  # records exactly as many events as it accepted. loadgen exits non-zero on
  # a mismatch, which is what makes it usable as a gate rather than a demo.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o metricflow .
      - run: go build -o loadgen ./cmd/loadgen

      - name: start the server
        run: |
          ./metricflow > server.log 2>&1 &
          echo $! > server.pid
          # Poll rather than sleep: a fixed sleep is either flaky or slow.
          for i in $(seq 1 50); do
            if curl -sf localhost:8080/health > /dev/null; then
              echo "server up after ${i} attempts"
              exit 0
            fi
            sleep 0.2
          done
          echo "server never became healthy"; cat server.log; exit 1

      - name: clean traffic must verify
        run: ./loadgen -duration 3s -workers 8

      - name: traffic with injected failures must still verify
        run: ./loadgen -duration 3s -workers 8 -bad 0.25

      # Batched traffic is a different write path with its own accounting:
      # a partially-rejected batch is a 200, so the number the server owes
      # comes from the reply body rather than the status. Gate it the same
      # way, clean and with rejects mixed in.
      - name: batched traffic must verify
        run: ./loadgen -duration 3s -workers 8 -batch 100

      - name: batched traffic with per-event rejects must still verify
        run: ./loadgen -duration 3s -workers 8 -batch 100 -bad 0.25

      # §27: a client inventing metric names must be refused rather than
      # allowed to grow the store without bound. -expect-cardinality fails
      # the step if the server never refused one, so it cannot pass against a
      # server with no limit. verify still has to hold while the cap fires,
      # which is the actual claim - a refused name touched nothing.
      - name: a cardinality flood must be refused, and stay exact
        run: ./loadgen -duration 5s -workers 8 -batch 50 -cardinality 20000 -expect-cardinality

      # §28: a response must be a strict, self-describing subset of what
      # matched. Asserted as a property rather than against a constant, so
      # tuning the limit does not mean editing this.
      #
      # It uses an explicit small limit rather than filling the store,
      # because §29 made filling it from one client impossible on purpose -
      # the flood above now creates a few dozen names rather than 32768. The
      # bound being tested is the same one either way.
      - name: /stats must stay bounded and say so
        run: |
          body=$(curl -sf --max-time 10 "localhost:8080/stats?limit=10")
          returned=$(echo "$body" | jq '.metrics | length')
          matched=$(echo "$body" | jq '.matched')
          truncated=$(echo "$body" | jq '.truncated')
          next=$(echo "$body" | jq -r '.next')
          echo "returned=$returned matched=$matched truncated=$truncated next=$next"

          if [ "$matched" -le 10 ]; then
            echo "only $matched metrics matched; nothing would be truncated, so this proves nothing"
            exit 1
          fi
          if [ "$returned" -gt 10 ]; then
            echo "/stats returned $returned metrics for limit=10 - the limit is not honoured"
            exit 1
          fi
          if [ "$truncated" != "true" ]; then
            echo "/stats dropped $((matched - returned)) metrics without saying so"
            exit 1
          fi
          if [ -z "$next" ] || [ "$next" = "null" ]; then
            echo "a truncated response carried no cursor; a client cannot continue"
            exit 1
          fi

      # §29, and the reason the whole slice exists: one client flooding
      # metric names must not cost a well-behaved client anything. The noisy
      # run starts first and is still going when the quiet one begins, so the
      # quiet client is introducing *new* names into a store under attack -
      # which is exactly the case that used to fail once the flood had filled
      # it.
      - name: a noisy client must not starve a quiet one
        run: |
          ./loadgen -duration 12s -workers 4 -batch 50 -cardinality 50000 \
            -client noisy -expect-cardinality > noisy.log 2>&1 &
          noisy=$!
          sleep 4

          ./loadgen -duration 4s -workers 4 -batch 50 -client quiet | tee quiet.log
          wait $noisy || { echo "the noisy run failed:"; cat noisy.log; exit 1; }

          echo "--- noisy ---"; tail -n 6 noisy.log

          if ! grep -q "verify: OK" quiet.log; then
            echo "the quiet client did not verify while another client flooded names"
            exit 1
          fi
          if grep -q "429" quiet.log; then
            echo "the quiet client was throttled by another client's flood"
            exit 1
          fi
          if ! grep -q "refused" noisy.log; then
            echo "the noisy client was never refused; its flood was not actually limited"
            exit 1
          fi

      - name: shut down cleanly
        run: |
          kill -TERM "$(cat server.pid)"
          # Graceful shutdown (DESIGN §15) should drain and exit on its own.
          for i in $(seq 1 100); do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "exited cleanly"
              cat server.log
              exit 0
            fi
            sleep 0.2
          done
          echo "server did not exit within 20s of SIGTERM"; cat server.log; exit 1

  # DESIGN §26: under overload the server must shed rather than queue, and a
  # shed request must be completely shed - never half-applied. This job runs
  # its own server with METRICFLOW_MAX_INFLIGHT=4 rather than the default
  # 256, because saturating 256 concurrent handlers honestly took 1500
  # workers and 2000-event batches locally, and a two-core runner cannot do
  # it. The limit is what changes; the code under test does not.
  overload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o metricflow .
      - run: go build -o loadgen ./cmd/loadgen

      - name: start a deliberately small server
        env:
          METRICFLOW_MAX_INFLIGHT: "4"
        run: |
          ./metricflow > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 50); do
            if curl -sf localhost:8080/health > /dev/null; then
              echo "server up after ${i} attempts"
              exit 0
            fi
            sleep 0.2
          done
          echo "server never became healthy"; cat server.log; exit 1

      # -expect-shed is what stops this passing vacuously: without it the
      # step would be just as green against a server with no limiter at all.
      # verify still has to hold while the shedding happens - that is the
      # actual claim, that a refused request touched nothing.
      - name: overload must shed, and stay exact while shedding
        run: ./loadgen -duration 5s -workers 64 -batch 20 -expect-shed

      # §31: the server must be able to account for the incident it just
      # had. This is the end-to-end claim that self-telemetry is wired to the
      # real counters rather than to zeroes - the run above shed hundreds of
      # thousands of requests, so the increase must be positive.
      #
      # Written in python rather than jq, unlike the gate in the e2e job,
      # because jq is not installed on the machine this was developed on and
      # an assertion nobody can dry-run is an assertion nobody has checked.
      - name: the server must report its own shedding
        run: |
          curl -sf --max-time 10 "localhost:8080/stats?prefix=metricflow." > self.json
          python3 - <<'PY'
          import json, sys

          with open("self.json") as f:
              metrics = json.load(f)["metrics"]

          for name in sorted(metrics):
              m = metrics[name]
              print("%-38s min=%-14g max=%-14g increase=%g"
                    % (name, m["min"], m["max"], m["max"] - m["min"]))

          def increase(name):
              if name not in metrics:
                  sys.exit("the server published no %s at all" % name)
              m = metrics[name]
              return m["max"] - m["min"]

          shed = increase("metricflow.requests.shed")
          accepted = increase("metricflow.events.accepted")

          if shed <= 0:
              sys.exit("the server shed requests but reports an increase of %g" % shed)
          if accepted <= 0:
              sys.exit("the server served requests but reports %g accepted" % accepted)
          print("self-telemetry agrees with the incident: shed +%g, accepted +%g"
                % (shed, accepted))
          PY

      - name: /health must answer even while the server is shedding
        run: |
          ./loadgen -duration 5s -workers 64 -batch 20 -expect-shed -verify=false &
          load=$!
          # A health check that gets shed makes an overloaded server look
          # dead, so an orchestrator would kill it. Poll throughout the run.
          for i in $(seq 1 20); do
            if ! curl -sf --max-time 2 localhost:8080/health > /dev/null; then
              echo "/health failed while the server was shedding"
              kill $load 2>/dev/null || true
              exit 1
            fi
            sleep 0.2
          done
          wait $load

      - name: shut down cleanly
        run: |
          kill -TERM "$(cat server.pid)"
          for i in $(seq 1 100); do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "exited cleanly"; cat server.log; exit 0
            fi
            sleep 0.2
          done
          echo "server did not exit within 20s of SIGTERM"; cat server.log; exit 1

  # §32: a graceful restart must lose nothing. Its own job because it needs a
  # server that is stopped and started again, which the e2e job's single
  # long-lived server cannot provide.
  #
  # This is also the one claim that cannot be made on the development machine:
  # taskkill does not deliver a signal a Go console process can catch on
  # Windows, so the graceful path - and the final snapshot it triggers - only
  # ever runs for real here.
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build -o metricflow .
      - run: go build -o loadgen ./cmd/loadgen

      - name: fill a server and stop it gracefully
        env:
          METRICFLOW_SNAPSHOT: snap.bin
        run: |
          ./metricflow > first.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 50); do
            curl -sf localhost:8080/health > /dev/null && break
            sleep 0.2
          done

          ./loadgen -duration 3s -workers 8 -batch 50 -client persist
          curl -sf "localhost:8080/stats?prefix=metric." > before.json

          kill -TERM "$(cat server.pid)"
          for i in $(seq 1 100); do
            kill -0 "$(cat server.pid)" 2>/dev/null || break
            sleep 0.2
          done
          if kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "the server did not exit"; cat first.log; exit 1
          fi
          cat first.log

      - name: a restart must bring the data back
        env:
          METRICFLOW_SNAPSHOT: snap.bin
        run: |
          ls -l snap.bin

          ./metricflow > second.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 50); do
            curl -sf localhost:8080/health > /dev/null && break
            sleep 0.2
          done
          curl -sf "localhost:8080/stats?prefix=metric." > after.json

          grep -E "restored" second.log || { echo "no restore line"; cat second.log; exit 1; }

          python3 - <<'PY'
          import json, sys

          def load(path):
              with open(path) as f:
                  return json.load(f)["metrics"]

          before, after = load("before.json"), load("after.json")

          if not before:
              sys.exit("the first server recorded nothing; this proves nothing")

          for name, b in sorted(before.items()):
              a = after.get(name)
              if a is None:
                  sys.exit("%s did not survive the restart" % name)
              for field in ("count", "avg", "min", "max", "p50", "p90", "p99"):
                  if a[field] != b[field]:
                      sys.exit("%s %s = %r after the restart, %r before"
                               % (name, field, a[field], b[field]))
              print("%-30s count=%-10d p99=%-10g survived intact" % (name, a["count"], a["p99"]))

          print("%d metrics restored with every number identical" % len(before))
          PY

          kill -TERM "$(cat server.pid)" || true

      # The whole reason a second generation is kept. The current file is
      # damaged and the server has to notice, say so, and use the one behind
      # it rather than losing the window.
      - name: a corrupt snapshot falls back to the previous generation
        env:
          METRICFLOW_SNAPSHOT: snap.bin
        run: |
          for i in $(seq 1 100); do
            kill -0 "$(cat server.pid)" 2>/dev/null || break
            sleep 0.2
          done
          if kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "the previous server is still running; it would rotate the"
            echo "file this step is about to damage, and the next one could"
            echo "not bind :8080"; cat third.log 2>/dev/null; exit 1
          fi

          test -f snap.bin      || { echo "no current snapshot"; exit 1; }
          test -f snap.bin.prev || { echo "no previous generation - rotation never happened"; exit 1; }
          ls -l snap.bin snap.bin.prev

          # Damage the current file only, leaving the one behind it intact.
          printf 'shredded' > snap.bin

          ./metricflow > third.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 50); do
            curl -sf localhost:8080/health > /dev/null && break
            sleep 0.2
          done

          grep -E "snap\.bin is unusable" third.log             || { echo "the damaged file was not reported"; cat third.log; exit 1; }
          grep -E "restored .* from snap\.bin\.prev" third.log             || { echo "it did not fall back to the previous generation"; cat third.log; exit 1; }

          curl -sf "localhost:8080/stats?prefix=metric." > fallback.json

          # Let the self-reporter's first sample land.
          for i in $(seq 1 30); do
            curl -sf "localhost:8080/stats?prefix=metricflow.snapshot." > fallback-self.json
            python3 -c "import json,sys; sys.exit(0 if 'metricflow.snapshot.load_failures' in json.load(open('fallback-self.json'))['metrics'] else 1)" && break
            sleep 0.5
          done

          python3 - <<'PY'
          import json, sys

          def load(path):
              with open(path) as f:
                  return json.load(f)["metrics"]

          before, after = load("before.json"), load("fallback.json")

          if not before:
              sys.exit("the first server recorded nothing; this proves nothing")

          for name, b in sorted(before.items()):
              a = after.get(name)
              if a is None:
                  sys.exit("%s was lost when the current snapshot was damaged" % name)
              for field in ("count", "avg", "min", "max", "p50", "p90", "p99"):
                  if a[field] != b[field]:
                      sys.exit("%s %s = %r after the fallback, %r before"
                               % (name, field, a[field], b[field]))

          print("%d metrics came back from the previous generation, intact" % len(before))

          # Nothing was lost, and the damage still has to be visible. If it
          # is not, a broken newest snapshot is indistinguishable from a
          # healthy restart and nobody finds out until the copy behind it
          # breaks too.
          selfm = load("fallback-self.json")

          lf = selfm.get("metricflow.snapshot.load_failures")
          if lf is None:
              sys.exit("no load failures published after falling back")
          if lf["max"] != 1:
              sys.exit("load failures = %r, want exactly the one damaged file" % lf["max"])

          empty = selfm.get("metricflow.snapshot.empty_starts")
          if empty is None:
              sys.exit("no empty starts published")
          if empty["max"] != 0:
              sys.exit("empty starts = %r, but the fallback succeeded" % empty["max"])

          print("the damaged generation was reported, and nothing was lost")
          PY

          kill -TERM "$(cat server.pid)" || true

      # And when there is nothing left to fall back to, it still starts. This
      # is the behaviour that changed: refusing here would turn a damaged
      # cache into a crash loop no operator can break without deleting a file
      # by hand.
      - name: both generations corrupt must still start, and say so
        env:
          METRICFLOW_SNAPSHOT: snap.bin
        run: |
          for i in $(seq 1 100); do
            kill -0 "$(cat server.pid)" 2>/dev/null || break
            sleep 0.2
          done
          if kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "the previous server is still running; it would rotate the"
            echo "files this step is about to damage"; cat fourth.log 2>/dev/null; exit 1
          fi

          printf 'shredded' > snap.bin
          printf 'shredded' > snap.bin.prev

          ./metricflow > fourth.log 2>&1 &
          echo $! > server.pid
          started=no
          for i in $(seq 1 50); do
            curl -sf localhost:8080/health > /dev/null && { started=yes; break; }
            sleep 0.2
          done
          [ "$started" = yes ]             || { echo "the server refused to start on a damaged snapshot"; cat fourth.log; exit 1; }

          grep -E "WARNING: no usable snapshot" fourth.log             || { echo "it started empty without saying so"; cat fourth.log; exit 1; }

          # Serving is the claim, so make it serve.
          curl -sf -X POST localhost:8080/ingest             -d "{\"name\":\"svc.after.corruption\",\"value\":1,\"ts\":$(date +%s)000}"             > /dev/null || { echo "the server started but will not ingest"; exit 1; }

          # And it has to be visible as a metric, not just in a log line
          # nobody greps at 3am.
          for i in $(seq 1 30); do
            curl -sf "localhost:8080/stats?prefix=metricflow.snapshot." > self.json
            python3 -c "import json,sys; sys.exit(0 if 'metricflow.snapshot.load_failures' in json.load(open('self.json'))['metrics'] else 1)" && break
            sleep 0.5
          done

          python3 - <<'PY'
          import json, sys

          with open("self.json") as f:
              m = json.load(f)["metrics"]

          lf = m.get("metricflow.snapshot.load_failures")
          if lf is None:
              sys.exit("the server started empty and published no load failure")
          if lf["max"] != 2:
              sys.exit("load failures = %r, want both damaged files counted" % lf["max"])

          empty = m.get("metricflow.snapshot.empty_starts")
          if empty is None:
              sys.exit("nothing was restored and no empty start was published")
          if empty["max"] < 1:
              sys.exit("empty starts = %r, want at least 1" % empty["max"])

          age = m.get("metricflow.snapshot.age_seconds")
          if age is None:
              sys.exit("no snapshot age published, so staleness is unalertable")

          print("reported %d unusable file(s), %d empty start(s); snapshot age %gs"
                % (lf["max"], empty["max"], age["max"]))
          PY

          kill -TERM "$(cat server.pid)" || true
