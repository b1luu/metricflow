name: Mutation Testing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GREMLINS_VERSION: v0.6.0
  GREMLINS_CONFIG: .gremlins.yaml
  GREMLINS_REPORT: gremlins-report.json

jobs:
  # Stable job name used as a required status check on main.
  mutation-test:
    name: mutation-test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is needed so `git diff --merge-base origin/<base>` works
          # in PR diff mode.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # MetricFlow has no third-party dependencies (no go.sum), so
          # setup-go's built-in cache would be skipped. Explicit caching below
          # covers module downloads (for Gremlins), clean build artifacts, and
          # the installed Gremlins binary.
          cache: false

      - name: Resolve Go cache paths
        id: go-env
        run: |
          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH | cut -d: -f1)/bin"
          fi
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobin=${gobin}" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules, build cache, and Gremlins binary
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.gomodcache }}
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gobin }}/gremlins
          key: go-mutation-v2-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-gremlins-${{ env.GREMLINS_VERSION }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            go-mutation-v2-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-gremlins-${{ env.GREMLINS_VERSION }}-
            go-mutation-v2-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-

      # Run unit tests first; if they fail, skip mutation testing.
      - name: Run unit tests
        id: unit-tests
        run: go test ./... -count=1

      - name: Install Gremlins (${{ env.GREMLINS_VERSION }})
        run: |
          go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"
          echo "${{ steps.go-env.outputs.gobin }}" >> "$GITHUB_PATH"

      - name: Run mutation tests
        id: gremlins
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # On pull requests, mutate only lines changed relative to the PR base
          # branch so checks finish in seconds/minutes. Manual workflow_dispatch
          # and merge_group runs evaluate the full codebase.
          diff_args=()
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            # Guard against an empty diff: Gremlins v0.6.0 treats an empty
            # diff map as "mutate everything".
            if [ -z "$(git diff --name-only --merge-base "origin/${BASE_REF}")" ]; then
              echo "no_mutable_changes=true" >> "$GITHUB_OUTPUT"
              echo "No files changed against origin/${BASE_REF}; skipping mutation run."
              exit 0
            fi
            diff_args+=(--diff="origin/${BASE_REF}")
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

          # Isolate Gremlins's temporary per-mutant builds in an ephemeral
          # GOCACHE so hundreds of uncacheable mutated packages don't bloat the
          # saved GitHub Actions cache (also guarantees uncached coverage timing).
          mutation_gocache="$(mktemp -d)"
          trap 'rm -rf "$mutation_gocache"' EXIT

          # Cap per-process virtual address space (2.5 GiB) so mutants that create
          # unbounded allocation loops (e.g. parser index decrement mutations)
          # abort cleanly with Go OOM (counted as KILLED rather than TIMED OUT)
          # instead of OOMing the 16 GiB runner across parallel workers.
          # Note: incompatible with `go test -race` (TSan reserves TB-scale VM).
          ulimit -v 2621440

          # Pass --config explicitly: without it, Gremlins v0.6.0 silently
          # ignores YAML parse errors and lets global/home configs shadow repo
          # thresholds.
          set +e
          GOCACHE="$mutation_gocache" gremlins unleash \
            --config="${GREMLINS_CONFIG}" \
            "${diff_args[@]}" \
            --output="${GREMLINS_REPORT}"
          gremlins_rc=$?
          set -e

          # Guard against silent green passes when zero mutants are discovered
          # (Gremlins exits 0 without writing a report if 0 mutants match).
          if [ ! -s "${GREMLINS_REPORT}" ]; then
            echo "::error::Gremlins did not produce ${GREMLINS_REPORT} (exit ${gremlins_rc})."
            exit "${gremlins_rc:-1}"
          fi

          read -r in_diff skipped evaluated < <(python3 - "${GREMLINS_REPORT}" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              d = json.load(f)
          skipped = 0
          in_diff = 0
          for entry in d.get("files") or []:
              for m in entry.get("mutations") or []:
                  if m.get("status") == "SKIPPED":
                      skipped += 1
                  else:
                      in_diff += 1
          evaluated = d.get("mutants_killed", 0) + d.get("mutants_lived", 0)
          print(in_diff, skipped, evaluated)
          PY
          )

          # In PR diff mode, a PR touching only docs/CI/tests/comments skips
          # every mutant (in_diff=0, skipped>0). Gremlins reports 0% efficacy
          # and exits 10 in that case; treat it as a clean pass rather than
          # blocking non-code PRs.
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${in_diff}" -eq 0 ] && [ "${skipped}" -gt 0 ]; then
            echo "no_mutable_changes=true" >> "$GITHUB_OUTPUT"
            echo "No mutable Go lines changed in this PR (${skipped} mutants skipped)."
            exit 0
          fi

          # Fail if Gremlins found 0 mutants anywhere (broken config/exclusions)
          # or if a full run evaluated 0 mutants.
          if [ "${in_diff}" -eq 0 ] && [ "${skipped}" -eq 0 ]; then
            echo "::error::Gremlins discovered 0 mutants; check exclude-files and config."
            exit 1
          fi
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${evaluated}" -le 0 ]; then
            echo "::error::Gremlins evaluated 0 mutants; check exclude-files and config."
            exit 1
          fi

          exit "${gremlins_rc}"

      - name: Upload mutation report
        if: ${{ !cancelled() && (steps.gremlins.outcome == 'success' || steps.gremlins.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: gremlins-report
          path: ${{ env.GREMLINS_REPORT }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Write job summary
        if: ${{ !cancelled() && (steps.gremlins.outcome == 'success' || steps.gremlins.outcome == 'failure') }}
        env:
          GREMLINS_OUTCOME: ${{ steps.gremlins.outcome }}
          GREMLINS_MODE: ${{ steps.gremlins.outputs.mode }}
          NO_MUTABLE_CHANGES: ${{ steps.gremlins.outputs.no_mutable_changes }}
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import sys

          report_path = os.environ["GREMLINS_REPORT"]
          config_path = os.environ["GREMLINS_CONFIG"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          outcome = os.environ.get("GREMLINS_OUTCOME", "unknown")
          mode = os.environ.get("GREMLINS_MODE", "full")
          no_mutable_changes = os.environ.get("NO_MUTABLE_CHANGES") == "true"

          mode_label = "PR diff" if mode == "diff" else "full codebase"

          if not os.path.exists(report_path):
              with open(summary_path, "a") as out:
                  out.write(f"## Mutation Testing ({mode_label})\n\n")
                  if no_mutable_changes:
                      out.write("Status: **PASSED** — no files changed against base branch.\n")
                  else:
                      out.write(f"Status: **{outcome}** (report `{report_path}` was not generated)\n")
              sys.exit(0)

          with open(report_path) as f:
              data = json.load(f)

          # Read configured thresholds from .gremlins.yaml without external YAML deps.
          eff_threshold = 0.0
          cov_threshold = 0.0
          if os.path.exists(config_path):
              with open(config_path) as cf:
                  cfg = cf.read()
              m_eff = re.search(r"^\s*efficacy:\s*([0-9.]+)", cfg, re.M)
              m_cov = re.search(r"^\s*mutant-coverage:\s*([0-9.]+)", cfg, re.M)
              if m_eff:
                  eff_threshold = float(m_eff.group(1))
              if m_cov:
                  cov_threshold = float(m_cov.group(1))

          timed_out = 0
          skipped = 0
          lived_by_file = collections.Counter()
          for entry in data.get("files") or []:
              fname = entry.get("file_name") or ""
              for mut in entry.get("mutations") or []:
                  st = mut.get("status")
                  if st == "TIMED OUT":
                      timed_out += 1
                  elif st == "SKIPPED":
                      skipped += 1
                  elif st == "LIVED":
                      lived_by_file[fname] += 1

          efficacy = data.get("test_efficacy", 0.0)
          coverage = data.get("mutations_coverage", 0.0)
          killed = data.get("mutants_killed", 0)
          lived = data.get("mutants_lived", 0)
          not_covered = data.get("mutants_not_covered", 0)
          not_viable = data.get("mutants_not_viable", 0)
          elapsed = float(data.get("elapsed_time", 0.0))

          mins, secs = divmod(int(round(elapsed)), 60)
          duration_str = f"{mins}m {secs}s" if mins else f"{elapsed:.1f}s"

          status_label = "PASSED" if outcome == "success" else "FAILED"
          eff_thresh_str = f"> {eff_threshold:g}%" if eff_threshold > 0 else "n/a"
          cov_thresh_str = f"> {cov_threshold:g}%" if cov_threshold > 0 else "n/a"

          def escape_md(s: str) -> str:
              return s.replace("|", "\\|").replace("`", "\\`")

          if no_mutable_changes:
              lines = [
                  f"## Mutation Testing ({mode_label}) — PASSED",
                  "",
                  f"No mutable Go lines changed in this PR ({skipped} mutants skipped, checked in {duration_str}).",
              ]
          else:
              lines = [
                  f"## Mutation Testing ({mode_label}) — {status_label}",
                  "",
                  "| Metric | Value | Threshold |",
                  "| --- | ---: | ---: |",
                  f"| **Test efficacy** | **{efficacy:.2f}%** | {eff_thresh_str} |",
                  f"| **Mutant coverage** | **{coverage:.2f}%** | {cov_thresh_str} |",
                  "",
                  "| Killed | Survived (Lived) | Not covered | Timed out | Skipped | Not viable | Duration |",
                  "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
                  f"| {killed} | {lived} | {not_covered} | {timed_out} | {skipped} | {not_viable} | {duration_str} |",
              ]

              if lived_by_file:
                  lines += [
                      "",
                      "### Top files with surviving mutants",
                      "",
                      "| File | Surviving mutants |",
                      "| --- | ---: |",
                  ]
                  for fname, count in lived_by_file.most_common(5):
                      lines.append(f"| `{escape_md(fname)}` | {count} |")

          with open(summary_path, "a") as out:
              out.write("\n".join(lines) + "\n")
          PY
